  <rect x="45" y="390" width="250" height="55" fill="#070b14" stroke="#1e2c4a" rx="4"/>
  <text x="60" y="415" fill="#38bdf8" font-family="monospace" font-size="12">AMS-001: Header Structure</text>
  <text x="60" y="435" fill="#34d399" font-family="sans-serif" font-size="11">✓ PASS (18-Octet Addressing)</text>

  <rect x="325" y="390" width="250" height="55" fill="#070b14" stroke="#1e2c4a" rx="4"/>
  <text x="340" y="415" fill="#38bdf8" font-family="monospace" font-size="12">AMS-006: Topic Routing</text>
  <text x="340" y="435" fill="#34d399" font-family="sans-serif" font-size="11">✓ PASS (Multicast Pub/Sub Active)</text>

  <rect x="605" y="390" width="250" height="55" fill="#070b14" stroke="#1e2c4a" rx="4"/>
