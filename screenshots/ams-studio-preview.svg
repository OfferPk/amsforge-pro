  <text x="500" y="220" fill="#34d399" font-family="monospace" font-size="11">4F 4C 4C 3D 30 2E 30 31 32 2C 20 50 49</text>
  <text x="500" y="240" fill="#34d399" font-family="monospace" font-size="11">54 43 48 3D 2D 30 2E 30 34 35 2C 20 59</text>
  <text x="500" y="260" fill="#a78bfa" font-family="monospace" font-size="11">41 57 3D 31 2E 32 33 30 4E 82</text>

